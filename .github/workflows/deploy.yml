name: Build and Deploy AutoSong Studio

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.16.5"

jobs:
  # Flutter Android Build
  build-android:
    runs-on: ubuntu-latest
    name: Build Flutter APK & AAB

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Decode Firebase google-services.json
        env:
          FIREBASE_GOOGLE_SERVICES_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_BASE64" ]; then
            echo "⚠️  FIREBASE_GOOGLE_SERVICES_BASE64 secret not set, using placeholder"
            cat > android_app/android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "autosong-studio-placeholder",
              "storage_bucket": "autosong-studio-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.autosong.autosong_studio"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "123456789-abcdefghijklmnop.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildPurposesOnly123456"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          else
            echo "$FIREBASE_GOOGLE_SERVICES_BASE64" | base64 -d > android_app/android/app/google-services.json
            echo "✅ google-services.json decoded from secret"
          fi

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="android_app/android/app/upload-keystore.jks"
          PROPS_PATH="android_app/android/key.properties"

          # Function to generate debug keystore
          generate_debug_keystore() {
              echo "⚠️ Generating temporary keystore..."
              keytool -genkey -v -keystore $KEYSTORE_PATH \
                  -keyalg RSA -keysize 2048 -validity 10000 \
                  -alias upload -storepass android -keypass android \
                  -dname "CN=Android Debug,O=Android,C=US" \
                  -noprompt
              
              echo "storePassword=android" > $PROPS_PATH
              echo "keyPassword=android" >> $PROPS_PATH
              echo "keyAlias=upload" >> $PROPS_PATH
              echo "storeFile=upload-keystore.jks" >> $PROPS_PATH
              echo "✅ Temporary keystore generated"
          }

          if [ -n "$KEYSTORE_BASE64" ]; then
              echo "🔐 Decoding keystore from secrets..."
              # Try to decode
              echo "$KEYSTORE_BASE64" | base64 -d --ignore-garbage > $KEYSTORE_PATH || true
              
              # Check if file exists and has size > 0
              if [ -s "$KEYSTORE_PATH" ]; then
                  echo "✅ Keystore decoded successfully"
                  echo "storePassword=$KEYSTORE_PASSWORD" > $PROPS_PATH
                  echo "keyPassword=$KEY_PASSWORD" >> $PROPS_PATH
                  echo "keyAlias=upload" >> $PROPS_PATH
                  echo "storeFile=upload-keystore.jks" >> $PROPS_PATH
              else
                  echo "❌ Keystore decode produced empty/invalid file. Falling back."
                  generate_debug_keystore
              fi
          else
              echo "ℹ️ No keystore secret found. Using debug keystore."
              generate_debug_keystore
          fi

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install Flutter dependencies
        working-directory: ./android_app
        run: flutter pub get

      - name: Run Flutter analyze
        working-directory: ./android_app
        run: flutter analyze || echo "⚠️  Analysis issues found (non-blocking)"

      - name: Build APK (Release)
        run: |
          rm -f android/gradlew android/gradlew.bat
          flutter build apk --release --verbose
          echo "✅ APK built successfully"

      - name: Build AAB (Release)
        working-directory: ./android_app
        run: |
          flutter build appbundle --release --verbose
          echo "✅ AAB built successfully"

      - name: Rename artifacts
        run: |
          mv android_app/build/app/outputs/flutter-apk/app-release.apk \
             android_app/build/app/outputs/flutter-apk/autosong-studio-v${{ github.run_number }}.apk

          mv android_app/build/app/outputs/bundle/release/app-release.aab \
             android_app/build/app/outputs/bundle/release/autosong-studio-v${{ github.run_number }}.aab

          echo "✅ Artifacts renamed with version number"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSong-Studio-APK-v${{ github.run_number }}
          path: android_app/build/app/outputs/flutter-apk/autosong-studio-v${{ github.run_number }}.apk
          retention-days: 90

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSong-Studio-AAB-v${{ github.run_number }}
          path: android_app/build/app/outputs/bundle/release/autosong-studio-v${{ github.run_number }}.aab
          retention-days: 90

      - name: Get APK size
        run: |
          APK_SIZE=$(du -h android_app/build/app/outputs/flutter-apk/autosong-studio-v${{ github.run_number }}.apk | cut -f1)
          AAB_SIZE=$(du -h android_app/build/app/outputs/bundle/release/autosong-studio-v${{ github.run_number }}.aab | cut -f1)
          echo "📦 APK Size: $APK_SIZE"
          echo "📦 AAB Size: $AAB_SIZE"

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f android_app/android/app/upload-keystore.jks
          rm -f android_app/android/key.properties
          rm -f android_app/android/app/google-services.json
          echo "🧹 Sensitive files cleaned up"

  # Deployment notification
  notify-deployment:
    runs-on: ubuntu-latest
    name: Deployment Summary
    needs: [build-android]
    if: always()

    steps:
      - name: Deployment Status
        run: |
          echo "=========================================="
          echo "🚀 AutoSong Studio APK Build Complete"
          echo "=========================================="
          echo "✅ Android APK & AAB built successfully"
          echo "🌐 Backend: Already deployed at https://jusdown.onrender.com"
          echo "📱 Build #${{ github.run_number }}"
          echo "=========================================="
