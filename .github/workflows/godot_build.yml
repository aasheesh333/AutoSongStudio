name: Build Godot Android

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  GODOT_VERSION: 4.2.1

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      # Keystore check and generation
      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
              echo "Generating new debug.keystore..."
              keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          else
              echo "debug.keystore already exists. Using existing file."
          fi

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          
          # Detect highest build-tools version
          BUILD_TOOLS_VER=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          
          # Define Paths
          ADB_PATH="$ANDROID_HOME/platform-tools/adb"
          ZIPALIGN_PATH="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VER/zipalign"
          APKSIGNER_PATH="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VER/apksigner"

          # Generate Editor Settings
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/jdk_path = "$JAVA_HOME"
          export/android/adb = "$ADB_PATH"
          export/android/adb_path = "$ADB_PATH"
          export/android/apksigner = "$APKSIGNER_PATH"
          export/android/apksigner_path = "$APKSIGNER_PATH"
          export/android/zipalign = "$ZIPALIGN_PATH"
          export/android/zipalign_path = "$ZIPALIGN_PATH"
          export/android/debug_keystore = "${{ github.workspace }}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Create Build Directory
        run: mkdir -p build

      # --- BUILD STEPS ---
      # Maine yahan "|| true" hata diya hai taki agar fail ho to error dikhe
      
      - name: Build Debug APK
        run: godot --headless --verbose --export-debug "Android" build/MergeIdleEmpire-debug.apk

      - name: Build Release APK
        run: godot --headless --verbose --export-release "Android" build/MergeIdleEmpire-release.apk

      - name: Build Release AAB
        run: godot --headless --verbose --export-release "Android AAB" build/MergeIdleEmpire-release.aab

      # --- DEBUGGING STEP ---
      # Ye step dhundega ki APK actually bana kahan hai (agar build folder me nahi hai to)
      - name: Find ANY APK files
        if: always()
        run: |
          echo "Looking for .apk files anywhere in the runner..."
          find . -name "*.apk"
          echo "Looking for .aab files anywhere in the runner..."
          find . -name "*.aab"
          echo "Listing build directory:"
          ls -R build/

      # --- UPLOAD STEP ---
      # Maine path change karke '**/*.apk' kar diya hai. 
      # Isse wo folder ke andar dhundh kar upload karega.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Builds
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
          retention-days: 5
