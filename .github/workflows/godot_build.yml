name: Build Godot Android

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  GODOT_VERSION: 4.2.1

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Configure Godot Android Settings
        run: |
          # Create Config Directory
          mkdir -p ~/.config/godot

          # Create editor_settings-4.tres
          # We manually write the required settings sections
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "${{ github.workspace }}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF

          # Verify Content
          echo "--- Editor Settings ---"
          cat ~/.config/godot/editor_settings-4.tres

      - name: Debug Info
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "Listing Android SDK:"
          ls -F "$ANDROID_HOME"
          echo "Listing Templates:"
          ls -R ~/.local/share/godot/export_templates/
          echo "Export Presets:"
          cat export_presets.cfg

      - name: Create Build Directory
        run: mkdir -p build

      - name: Build Debug APK
        run: godot --headless --verbose --export-debug "Android" build/MergeIdleEmpire-debug.apk

      - name: Build Release APK
        run: godot --headless --verbose --export-release "Android" build/MergeIdleEmpire-release.apk

      - name: Build Release AAB
        run: godot --headless --verbose --export-release "Android AAB" build/MergeIdleEmpire-release.aab

      - name: List Files (Post-Build)
        run: ls -R build/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-Builds
          path: build/
