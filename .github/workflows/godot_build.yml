name: Build Godot Android

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  GODOT_VERSION: 4.2.1

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Build Debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/MergeIdleEmpire-debug.apk

      - name: Build Release APK
        # Exporting Release APK using the same preset but with release flag.
        # Ensure export_presets.cfg has valid keystore/release fields.
        run: |
          godot --headless --verbose --export-release "Android" build/MergeIdleEmpire-release.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-Builds
          path: build/
