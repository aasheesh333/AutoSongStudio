<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AutoSong Studio - Create Scheduler</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2565e4",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                        "surface-dark": "#1c1f26",
                        "border-dark": "#2a2d36",
                        "text-secondary": "#9da6b8"
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }.no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased selection:bg-primary selection:text-white">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark overflow-x-hidden shadow-2xl">
<header class="sticky top-0 z-20 grid grid-cols-[40px_1fr_40px] items-center px-4 py-3 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-b border-gray-200 dark:border-border-dark">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-white" style="font-size: 24px;">arrow_back_ios_new</span>
</button>
<div class="flex flex-col items-center justify-center gap-1.5">
<h1 class="text-base font-bold leading-tight tracking-tight text-center">Create Scheduler</h1>
<div class="flex items-center gap-1.5">
<div class="size-1.5 rounded-full bg-gray-300 dark:bg-gray-600"></div>
<div class="size-1.5 rounded-full bg-gray-300 dark:bg-gray-600"></div>
<div class="size-1.5 rounded-full bg-primary"></div>
</div>
</div>
<button class="flex items-center justify-end px-1">
<span class="text-primary font-bold text-sm hover:text-primary/80 transition-colors cursor-pointer">Save</span>
</button>
</header>
<main class="flex-1 flex flex-col px-5 pb-32 pt-6 gap-8">
<section class="flex flex-col gap-3">
<label class="flex justify-between items-baseline" for="prompt-input">
<span class="text-xs font-bold uppercase tracking-wider text-text-secondary">Content Title / Prompt</span>
<span class="text-xs font-medium text-text-secondary" id="char-count">0/500</span>
</label>
<div class="relative group">
<textarea class="w-full bg-white dark:bg-surface-dark border border-gray-200 dark:border-border-dark rounded-xl p-4 text-base placeholder:text-text-secondary focus:ring-2 focus:ring-primary focus:border-transparent outline-none resize-none min-h-[140px] transition-all duration-200 ease-in-out shadow-sm" id="prompt-input" placeholder="e.g., Lofi Hip Hop Beats Daily Mix... Describe the content style and mood."></textarea>
<div class="absolute bottom-3 right-3 pointer-events-none">
<span class="material-symbols-outlined text-text-secondary/30" style="font-size: 20px;">edit_note</span>
</div>
</div>
<p class="text-xs text-text-secondary leading-relaxed pl-1">
                This title will be used to generate metadata and organize your automation queue.
            </p>
</section>
<hr class="border-gray-200 dark:border-border-dark"/>
<section class="flex flex-col gap-4">
<span class="text-xs font-bold uppercase tracking-wider text-text-secondary">Repeat Frequency</span>
<div class="flex p-1 bg-gray-200 dark:bg-surface-dark rounded-lg border border-gray-300 dark:border-border-dark">
<button class="flex-1 py-2 text-sm font-semibold rounded-md text-text-secondary hover:text-slate-900 dark:hover:text-white transition-colors">Once</button>
<button class="flex-1 py-2 text-sm font-semibold rounded-md bg-white dark:bg-primary text-primary dark:text-white shadow-sm transition-all">Weekly</button>
<button class="flex-1 py-2 text-sm font-semibold rounded-md text-text-secondary hover:text-slate-900 dark:hover:text-white transition-colors">Monthly</button>
</div>
</section>
<section class="flex flex-col gap-4">
<div class="flex justify-between items-center">
<span class="text-xs font-bold uppercase tracking-wider text-text-secondary">Active Days</span>
<span class="text-xs text-primary font-medium cursor-pointer">Select All</span>
</div>
<div class="flex justify-between items-center gap-2">
<button class="flex flex-col items-center gap-1 group">
<div class="size-10 rounded-full flex items-center justify-center border border-gray-300 dark:border-border-dark text-text-secondary bg-white dark:bg-transparent group-hover:border-primary transition-all">
<span class="text-sm font-bold">S</span>
</div>
</button>
<button class="flex flex-col items-center gap-1 group">
<div class="size-10 rounded-full flex items-center justify-center bg-primary text-white shadow-lg shadow-primary/30 transform scale-105 transition-all">
<span class="text-sm font-bold">M</span>
</div>
</button>
<button class="flex flex-col items-center gap-1 group">
<div class="size-10 rounded-full flex items-center justify-center border border-gray-300 dark:border-border-dark text-text-secondary bg-white dark:bg-transparent group-hover:border-primary transition-all">
<span class="text-sm font-bold">T</span>
</div>
</button>
<button class="flex flex-col items-center gap-1 group">
<div class="size-10 rounded-full flex items-center justify-center bg-primary text-white shadow-lg shadow-primary/30 transform scale-105 transition-all">
<span class="text-sm font-bold">W</span>
</div>
</button>
<button class="flex flex-col items-center gap-1 group">
<div class="size-10 rounded-full flex items-center justify-center border border-gray-300 dark:border-border-dark text-text-secondary bg-white dark:bg-transparent group-hover:border-primary transition-all">
<span class="text-sm font-bold">T</span>
</div>
</button>
<button class="flex flex-col items-center gap-1 group">
<div class="size-10 rounded-full flex items-center justify-center bg-primary text-white shadow-lg shadow-primary/30 transform scale-105 transition-all">
<span class="text-sm font-bold">F</span>
</div>
</button>
<button class="flex flex-col items-center gap-1 group">
<div class="size-10 rounded-full flex items-center justify-center border border-gray-300 dark:border-border-dark text-text-secondary bg-white dark:bg-transparent group-hover:border-primary transition-all">
<span class="text-sm font-bold">S</span>
</div>
</button>
</div>
</section>
<section class="flex flex-col gap-3">
<span class="text-xs font-bold uppercase tracking-wider text-text-secondary">Post Time (Local)</span>
<div class="flex items-center justify-between p-4 bg-white dark:bg-surface-dark border border-gray-200 dark:border-border-dark rounded-xl shadow-sm cursor-pointer hover:border-primary/50 transition-colors">
<div class="flex items-center gap-3">
<div class="p-2 bg-primary/10 rounded-lg text-primary">
<span class="material-symbols-outlined">schedule</span>
</div>
<div class="flex flex-col">
<span class="text-lg font-bold text-slate-900 dark:text-white">12:00</span>
<span class="text-xs text-text-secondary font-medium">Noon</span>
</div>
</div>
<div class="flex bg-gray-100 dark:bg-background-dark rounded-lg p-1 border border-gray-200 dark:border-border-dark">
<span class="px-3 py-1 text-xs font-bold bg-white dark:bg-surface-dark rounded shadow-sm text-slate-900 dark:text-white">PM</span>
<span class="px-3 py-1 text-xs font-bold text-text-secondary hover:text-slate-900 dark:hover:text-white transition-colors">AM</span>
</div>
</div>
</section>
<div class="h-6"></div>
</main>
<div class="fixed bottom-0 left-0 right-0 z-30">
<div class="h-12 w-full bg-gradient-to-b from-transparent to-background-light dark:to-background-dark pointer-events-none"></div>
<div class="bg-background-light dark:bg-background-dark px-5 pb-8 pt-2 max-w-md mx-auto">
<button class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary/90 text-white font-bold text-lg py-4 rounded-xl shadow-xl shadow-primary/20 transition-all active:scale-[0.98]">
<span>Create Schedule</span>
<span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</div>
</div>
</div>

</body></html>
